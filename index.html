<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sudoku Tetris</title>
  <!-- Favicons / app icons -->
  <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png" />
  <link rel="shortcut icon" href="assets/favicon/favicon.ico" />
  <link rel="manifest" href="assets/favicon/site.webmanifest" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css?v=2.9.1" />
</head>
<body>
  <!-- Animated background -->
  <div class="bg" aria-hidden="true">
    <div class="blob blob--1"></div>
    <div class="blob blob--2"></div>
    <div class="blob blob--3"></div>
  </div>

  <!-- Settings gear: opens the language / music / sound panel -->
  <div class="audio-controls">
    <button id="settingsBtn" class="audio-btn" data-i18n-title="settings" aria-label="Settings" aria-haspopup="true" aria-expanded="false">⚙️</button>
    <div id="settingsPanel" class="settings-panel" role="dialog" aria-label="Settings" hidden>
      <div class="settings-row">
        <span class="settings-row-label" data-i18n="language">🌐 Language</span>
        <div class="lang-select" role="group" aria-label="Language">
          <button type="button" id="langEn" class="lang-btn" data-lang="en" aria-pressed="true">🇬🇧</button>
          <button type="button" id="langDe" class="lang-btn" data-lang="de" aria-pressed="false">🇩🇪</button>
          <button type="button" id="langPl" class="lang-btn" data-lang="pl" aria-pressed="false">🇵🇱</button>
          <button type="button" id="langEs" class="lang-btn" data-lang="es" aria-pressed="false">🇪🇸</button>
          <button type="button" id="langRu" class="lang-btn" data-lang="ru" aria-pressed="false">🇷🇺</button>
          <button type="button" id="langTr" class="lang-btn" data-lang="tr" aria-pressed="false">🇹🇷</button>
          <button type="button" id="langFr" class="lang-btn" data-lang="fr" aria-pressed="false">🇫🇷</button>
          <button type="button" id="langNo" class="lang-btn" data-lang="no" aria-pressed="false">🇳🇴</button>
          <button type="button" id="langZh" class="lang-btn" data-lang="zh" aria-pressed="false">🇨🇳</button>
        </div>
      </div>
      <label class="toggle settings-toggle" for="musicToggle">
        <input type="checkbox" id="musicToggle" />
        <span class="toggle-slider"></span>
        <span class="toggle-label" data-i18n="music">Music</span>
      </label>
      <label class="toggle settings-toggle" for="sfxToggle">
        <input type="checkbox" id="sfxToggle" />
        <span class="toggle-slider"></span>
        <span class="toggle-label" data-i18n="sfx">Sound effects</span>
      </label>
    </div>
  </div>

  <main class="container">
    <!-- ═══════════════ START SCREEN ═══════════════ -->
    <section id="startScreen" class="screen active">
      <div class="hero">
        <img id="logo" src="assets/cats/1.png" alt="Tedosu Logo" class="logo" width="100px" height="100px" />
        <h1 class="title"><span class="gradient-text">Tedosu</span></h1>
        <p class="tagline" data-i18n="tagline">One piece at a time.</p>
      </div>

      <div class="card settings-card">
        <div class="setting-group">
          <label for="gameMode" data-i18n="gameMode">🎮 Game Mode</label>
          <select id="gameMode">
            <option value="kids-4" data-i18n="mode.kids4">Kids 4x4 (Cats)</option>
            <option value="classic-9" selected data-i18n="mode.classic9">Classic 9x9</option>
            <option value="hex-16" data-i18n="mode.hex16">Hex 16x16</option>
          </select>
          <p id="modeDescription" class="mode-description"></p>
        </div>

        <div class="setting-group">
          <label for="difficulty" data-i18n="difficulty">Difficulty</label>
          <select id="difficulty">
            <option value="easy" data-i18n="diff.easy">Easy</option>
            <option value="medium" selected data-i18n="diff.medium">Medium</option>
            <option value="hard" data-i18n="diff.hard">Hard</option>
          </select>
          <p id="difficultyDescription" class="mode-description"></p>
        </div>

        <div class="setting-group seed-group">
          <label for="seedInput" data-i18n="seedOptional">🎲 Seed (optional)</label>
          <input type="text" id="seedInput" class="seed-input" data-i18n-placeholder="seedPlaceholder" placeholder="e.g. 0x1A2B3C4D5E6F or any text" />
          <p class="mode-description" data-i18n="seedLeaveEmpty">Leave empty for a random seed.</p>
        </div>

      </div>

      <button id="startBtn" class="btn btn-primary" data-i18n="startGame">▶ Start Game</button>
    </section>

    <!-- ═══════════════ GAME SCREEN ═══════════════ -->
    <section id="gameScreen" class="screen">
      <header class="game-header">
        <button id="menuBtn" class="btn btn-ghost" data-i18n="menu" data-i18n-title="backToMenu">← Menu</button>
        <div class="game-title">
          <h2 id="gameModeTitle">Classic 9x9</h2>
          <span id="gameBadge" class="badge">Medium</span>
        </div>
        <button id="newGameBtn" class="btn btn-ghost" data-i18n="newGame" data-i18n-title="newGameTitle">↻ New</button>
      </header>

      <div id="seedBar" class="seed-bar" hidden><span data-i18n="seedLabel">Seed: </span><span id="seedValue"></span></div>

      <div class="game-info">
        <div class="stat stat--lives">
          <div>
            <span class="stat-label" data-i18n="lives">Lives</span>
            <span id="lives" class="stat-value">❤️❤️❤️</span>
          </div>
        </div>

        <div class="current-piece">
          <span class="piece-label" data-i18n="currentPiece">Current Piece</span>
          <div id="currentPieceDisplay" class="piece-display">-</div>
          <div id="specialPieceInfo" class="special-piece-info" hidden>
            <span id="specialPieceName" class="special-piece-name"></span><span id="specialPieceDesc" class="special-piece-desc"></span>
          </div>
          <div id="pieceTimerWrap" class="piece-timer" hidden>
            <span>⏱</span>
            <span id="pieceTimerValue">--:--</span>
          </div>
          <div id="hintsPill" class="hints-pill" hidden><span data-i18n="hintsLabel">💡 Hints: </span><span id="hintsCount">0</span></div>
        </div>

        <div class="stat stat--timer">
          <span class="stat-icon">⏱</span>
          <div>
            <span class="stat-label" data-i18n="time">Time</span>
            <span id="timer" class="stat-value">00:00</span>
          </div>
        </div>
      </div>

      <div id="board" class="board"></div>

      <div class="controls">
        <button id="hintBtn" class="btn btn-secondary" data-i18n="hint">💡 Hint</button>
        <button id="resetBtn" class="btn btn-secondary" data-i18n="reset">🔄 Reset</button>
      </div>

      <div id="message" class="message"></div>
    </section>
  </main>

  <!-- Win summary modal -->
  <div id="winModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="winTitle" hidden>
    <div class="modal">
      <h2 id="winTitle" class="modal-title" data-i18n="youWin">🎉 You Win!</h2>
      <div class="win-stats">
        <div class="win-stat">
          <span class="win-stat-label" data-i18n="time">Time</span>
          <span id="winTime" class="win-stat-value">00:00</span>
        </div>
        <div class="win-stat">
          <span class="win-stat-label" data-i18n="lives">Lives</span>
          <span id="winLives" class="win-stat-value">❤️❤️❤️</span>
        </div>
        <div class="win-stat">
          <span class="win-stat-label" data-i18n="errors">Errors</span>
          <span id="winErrors" class="win-stat-value">0</span>
        </div>
      </div>
      <div id="winMessage" class="win-message"></div>
      <div class="modal-actions">
        <button id="winPlayAgainBtn" class="btn btn-primary" data-i18n="playAgain">▶ Play Again</button>
        <button id="winMenuBtn" class="btn btn-ghost" data-i18n="menu">← Menu</button>
      </div>
    </div>
  </div>

  <script src="js/translations.js?v=2.9.1"></script>
  <script src="js/i18n.js?v=2.9.1"></script>
  <script src="js/config.js?v=2.9.1"></script>
  <script src="js/state.js?v=2.9.1"></script>
  <script src="js/dom.js?v=2.9.1"></script>
  <script src="js/seeded.js?v=2.9.1"></script>
  <script src="js/puzzle.js?v=2.9.1"></script>
  <script src="js/game.js?v=2.9.1"></script>
  <script src="js/audio.js?v=2.9.1"></script>
  <script src="js/ui.js?v=2.9.1"></script>
</body>
</html>
